  # ── Deployment Rollback ───────────────────────────────────────────────────────
  /deployments/{deployment_id}/rollback:
    post:
      operationId: rollbackDeployment
      summary: Roll back a deployment to a previous revision
      tags: [Rollback]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deployment_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        revision_id:
                          type: string
                          description: ID of the specific image revision to roll back to. Defaults to the previous healthy revision.
                        reason:
                          type: string
                          description: Human-readable reason for the rollback.
      responses:
        "202":
          description: Rollback accepted
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum: [rollbacks]
                      attributes:
                        type: object
                        properties:
                          rollback_type:
                            type: string
                            enum: [canary, version, image]
                          deployment_name:
                            type: string
                          image_tag:
                            type: string
                            nullable: true
                            description: Image tag written to kustomization.yaml; present only for image rollbacks.
                          commit_sha:
                            type: string
                            nullable: true
                            description: GitOps commit SHA for the rollback change; present only for image and version rollbacks.
                          rolled_back_at:
                            type: string
                            format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: releaseDeploymentImageHold
      summary: Release an image-automation hold, resuming Flux automation
      tags: [Rollback]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deployment_id
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Deployment Image Revisions ────────────────────────────────────────────────
  /deployments/{deployment_id}/image_revisions:
    get:
      operationId: listDeploymentImageRevisions
      summary: List recorded image revisions for a deployment
      tags: [Rollback]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deployment_id
          required: true
          schema:
            type: string
        - in: query
          name: page[number]
          schema:
            type: integer
        - in: query
          name: page[size]
          schema:
            type: integer
      responses:
        "200":
          description: List of image revisions
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [image_revisions]
                        attributes:
                          type: object
                          properties:
                            image_reference:
                              type: string
                            image_digest:
                              type: string
                            source_commit:
                              type: string
                            started_serving_at:
                              type: string
                              format: date-time
                            health_status:
                              type: string
                              enum: [unknown, healthy, failed, rolled_back]
                  meta:
                    type: object
                  links:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
