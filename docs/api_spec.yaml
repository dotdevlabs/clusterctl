  # ── Connector Endpoints (application/json, per-cluster auth) ─────────────────
  /connector_heartbeat:
    post:
      operationId: connectorHeartbeatLegacy
      summary: Legacy connector heartbeat (kept for backward compatibility)
      description: >
        Called by in-cluster connector agents. Uses a per-cluster Bearer token,
        not the API token scheme. Returns application/json.
      security:
        - bearerAuth: []
      tags: [Connector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorStatusResponse"
        "401":
          description: Invalid connector token

  /connector/heartbeat:
    post:
      operationId: connectorHeartbeat
      summary: Connector heartbeat
      description: >
        Called by in-cluster connector agents and by the heartbeat-source workload
        (co-deployed in clustercontrol-system). Uses a per-cluster Bearer token.
        The optional `service` field identifies which critical in-cluster service
        the ping is for (e.g. "loki"); when absent the ping is attributed to the
        Connector agent itself. Returns application/json.
      security:
        - bearerAuth: []
      tags: [Connector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service:
                  type: string
                  description: >
                    Identifier of the in-cluster service whose health was verified
                    before sending this ping (e.g. "loki"). Omit for Connector
                    agent heartbeats.
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorStatusResponse"
        "401":
          description: Invalid connector token

  /connector/inventory:
    post:
      operationId: connectorInventory
      summary: Connector inventory report
      description: >
        Called by in-cluster connector agents to report cluster inventory.
        Returns application/json.
      security:
        - bearerAuth: []
      tags: [Connector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Inventory accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorStatusResponse"
        "401":
          description: Invalid connector token

  /connector/flux_events:
